services:
  dia:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - dia-data:/app/data

volumes:
  dia-data:
